{% if include.media.src and include.media.src != '' %}
<figure class="work-media{% if include.media.wide %} work-media--wide{% endif %}{% if include.media.portrait %} work-media--portrait{% endif %}">
  {% if include.media.kind == 'video' %}
  <video controls preload="none" playsinline{% if include.media.silent %} muted{% endif %} aria-label="{{ include.media.title | escape }}"{% if include.media.poster and include.media.poster != '' %} poster="{{ include.media.poster | relative_url }}"{% endif %}>
    <source src="{{ include.media.src | relative_url }}" type="video/mp4">
    <a href="{{ include.media.src | relative_url }}">Download video: {{ include.media.title }}</a>
  </video>
  {% else %}
  <a class="work-image-link" href="{{ include.media.src | relative_url }}" aria-label="View full image: {{ include.media.title | escape }}"><img src="{{ include.media.src | relative_url }}" alt="{{ include.media.alt | escape }}" loading="lazy"></a>
  {% endif %}
  <figcaption>{{ include.media.caption | default: include.media.title }}</figcaption>
</figure>
{% endif %}
