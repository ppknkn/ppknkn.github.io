    "summary": "Overall wheel-legged chassis design for a tennis ball-service robot in a Jiaolong × Lumistar collaboration.",
    "question": "The project aims to reduce the interruptions caused by collecting and handing over balls during tennis practice. My chassis work translates that court-side service workflow into the mobility, stability and packaging needs of a wheel-legged platform.",
    "scope": "I am designing the overall wheel-legged chassis for a tennis ball-service robot in the Jiaolong × Lumistar collaboration. My work covers the chassis layout, mobility and mechanical interfaces with the ball-handling modules.",
    "decisions": [
      {
        "title": "Design around subsystem interfaces",
        "text": "Account for the packaging and structural interfaces of the ball-handling modules within the mobile platform."
      },
      {
        "title": "Consider stability across operation",
        "text": "Develop the chassis with changing payload and stationary service operations in mind."
