    "number": "01",
    "name": "SparkR",
    "subtitle": "A wheel-legged robot, from structure to control",
    "category": "Robotics · System integration",
    "period": "Mar–Jun 2026",
    "state": "Built",
    "group": "completed",
    "role": "Independent mechanical, electronics & control development",
    "summary": "A compact wheel-legged platform that brings mechanism design, custom electronics and balance control into one working prototype.",
    "question": "I developed SparkR as a compact wheel-legged platform for mobility and visual inspection in confined spaces. The rescue-inspection use case shaped the design: a small body, folding leg geometry, efficient rolling and an onboard camera view for the operator.",
    "scope": "I designed and built SparkR’s mechanical structure, custom electronics and embedded controller, bringing the platform from CAD and PCB design to assembly and balance tuning.",
    "decisions": [
      {
        "title": "Compact similar-linkage legs",
        "text": "Use two driven inputs per side to control effective leg length and angle, with a driven wheel at the end of each leg."
      },
      {
        "title": "Model-based balance control",
        "text": "Run IMU-based state estimation, VMC-LQR and PID control on STM32, with motor feedback and commands carried over CAN."
      },
      {
        "title": "Build the whole electrical path",
        "text": "Integrate the battery, custom power-distribution and CAN boards, sensors, motors and FPV video into one physical platform."
      }
    ],
    "process": [
      {
        "title": "First integrated hardware",
        "text": "The initial version used direct-drive joint motors and a heavier frame, at about 3 kg. Holding the robot upright required high continuous motor current and exposed a joint-heating problem."
      },
      {
        "title": "Actuator and mass revision",
        "text": "I moved the joints to geared DM4310 motors and revised the battery and frame. The resulting platform weighed 2.3 kg, with less holding-current demand at the joints."
      },
      {
        "title": "Electrical integration",
        "text": "Power-distribution and CAN PCBs, soldering and cable routing brought the motors, sensing and controller into a serviceable assembly."
      },
      {
        "title": "Balance tuning",
        "text": "Controller bring-up progressed from PID toward the STM32 VMC-LQR implementation, followed by communication, estimation and physical-platform tuning."
      }
    ],
