    "chapters": [
      {
        "id": "mechanism",
        "label": "Mechanism",
        "title": "A wheel-legged mechanism at 20 cm scale",
        "paragraphs": [
          "Each side uses a similar-linkage mechanism with two joint actuators and a direct-drive wheel. The linkages translate the two joint angles into effective leg length and leg angle, giving the body adjustable support geometry while preserving wheel-based motion.",
          "The compact arrangement concentrates the driven joints near the body. This reduces the lateral space needed for the leg mechanism and keeps wiring close to the chassis. I compared the packaging and kinematic tradeoffs of conventional serial legs, parallel legs and the similar-linkage arrangement before developing the latter.",
          "The revised hardware uses four DM4310 geared joint motors and two JC4310 wheel motors. Joint reduction helps provide the holding torque needed for a two-wheel balance platform. The frame combines a lightened acrylic base with 3D-printed parts where the load path permits them."
        ],
        "image": {
          "kind": "image",
          "src": "/images/projects/sparkr-leg-kinematics.png",
          "title": "SparkR leg geometry",
          "alt": "CAD and kinematic layout of the SparkR similar-linkage leg, showing the driven linkage geometry.",
          "caption": "Similar-linkage leg geometry and its kinematic layout."
        }
      },
      {
        "id": "embedded-control",
        "label": "Control",
        "title": "From sensors to motor commands",
        "paragraphs": [
          "The real-time controller runs on an STM32F405-based RoboMaster A board at a 1 ms period. IMU measurements and motor feedback provide the body and joint state used by the balance controller.",
          "Attitude estimation combines accelerometer and gyroscope information. The LQR formulation uses body pitch, pitch rate, longitudinal position and velocity, while the VMC layer connects the virtual leg geometry to joint actuation. CAN links the embedded controller to the joint and wheel motors.",
          "I started with PID-based control to bring up the hardware, then developed the VMC-LQR balance controller as the mechanism, communication and state estimation came together. Remote-control input and FPV video provide an operator interface alongside the balance loop."
        ],
        "flow": [
          {
            "title": "Sense",
            "text": "IMU measurements and motor position / speed feedback"
          },
          {
            "title": "Estimate",
            "text": "Body attitude, angular motion and wheel-based motion state"
          },
          {
            "title": "Control",
            "text": "VMC-LQR balance control and PID loops"
          },
          {
            "title": "Actuate",
            "text": "CAN commands to joint and wheel motors"
          }
        ]
      },
      {
        "id": "electronics",
        "label": "Electronics",
        "title": "Power, wiring and the operator view",
        "paragraphs": [
          "I designed the power-distribution and CAN hub PCBs in EasyEDA and handled fabrication, soldering and system wiring. Bringing those connections onto dedicated boards made the motor, controller and sensor interfaces easier to assemble and debug.",
          "The revised platform uses a 6S LiPo battery. Motor power and the lower-voltage electronics are arranged around the chassis layout, with a compact FPV camera and video transmitter providing the remote view. This electrical integration was developed together with the mechanism so that board placement and cable routing fit the assembled robot."
        ]
      },
