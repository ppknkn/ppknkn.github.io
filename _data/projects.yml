    "name": "RoboMaster leg mechanism",
    "subtitle": "Lightweight composite design at subsystem scale",
    "category": "Mechanical design · Manufacturing",
    "period": "Dec 2024–Aug 2025",
    "state": "Built",
    "group": "completed",
    "role": "Leg subsystem design & manufacturing",
    "summary": "A hollow carbon-fiber leg developed through structural comparison and manufacturing iteration for a balance-infantry robot.",
    "question": "The original leg was machined from thick carbon-fiber plate. During competition use, leg flex and vibration made bending and torsional stiffness a practical concern, while the plate-based geometry remained heavy even after material removal. I redesigned the part as a hollow composite shell.",
    "scope": "I designed, simulated and manufactured the leg subsystem for Jiaolong’s balance-infantry robot. My work connected hollow composite geometry, structural comparisons and the practical details of molding and assembly.",
    "decisions": [
      {
        "title": "Move material toward the shell",
        "text": "Use a hollow section to put material around the load-carrying perimeter and reduce the mass of the leg."
      },
      {
        "title": "Orient the fibers for the load",
        "text": "Consider bending and torsion when choosing fiber directions, including a roughly 45° bias relative to the leg axis."
      },
      {
        "title": "Separate molding from precision features",
        "text": "Form the composite structure around a PMI core, then finish critical interfaces by CNC machining."
      }
    ],
    "process": [
      {
        "title": "Identify the plate-leg problem",
        "text": "Start from the observed flex, vibration and mass of the existing machined leg."
      },
      {
        "title": "Develop the hollow structure",
        "text": "Model the shell and compare structural alternatives while retaining the robot’s leg interfaces."
      },
      {
        "title": "Work through the molding route",
        "text": "Select the PMI-core process, coordinate layup and make the first composite parts."
      },
      {
        "title": "Refine the finished assembly",
        "text": "Use machining, assembly checks and workshop feedback to address fit and bonding details."
      }
    ],
