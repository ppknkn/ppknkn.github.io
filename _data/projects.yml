      {
        "title": "A lighter leg for the balance-infantry robot",
        "text": "The redesigned leg reduced mass by 50 g per leg. Jiaolong went on to win the RoboMaster 2025 national championship / First Prize."
      }
    ],
    "chapters": [
      {
        "id": "shell-design",
        "label": "Shell design",
        "title": "From a machined plate to a composite shell",
        "paragraphs": [
          "The starting part used an 18 mm carbon-fiber plate. Opening up the plate removed some material, but the load path still inherited the geometry and fiber distribution of a flat laminate. The new design treats the leg as a shell, drawing on the structural logic of tubes, frames and biological bones.",
          "A closed section places material away from the neutral axis and gives the leg a useful torsional load path. I developed the hollow geometry around the existing leg configuration, keeping the bearing and transmission interfaces compatible with the surrounding assembly.",
          "Composite fiber direction matters as much as external shape. I considered a torsion-oriented bias around 45° to the leg axis and discussed the actual placement with the workshop while participating in the layup process."
        ]
      },
      {
        "id": "manufacturing",
        "label": "Manufacturing",
        "title": "Making the shell and the interfaces together",
        "paragraphs": [
          "I compared internal-bladder and foam-supported forming routes against the part geometry and the available workshop processes. The selected route uses a PMI foam core, an external vacuum bag and autoclave curing to produce the composite blank.",
          "Carbon-fiber plate inserts are incorporated at feature locations during molding. CNC finishing then creates the precision needed at the bearing seats and transmission interfaces. This lets the shell carry the structural load while machining controls the final assembly dimensions.",
          "The workshop feedback fed directly into the CAD. Rounded transitions, accessible openings, manageable wall geometry and room for finishing all affected whether the part could be laid up, compacted, demolded and assembled."
        ],
        "table": {
          "headers": [
            "Design consideration",
            "How it shaped the part"
          ],
          "rows": [
            [
              "Fiber conformity",
              "Round corners and transitions so the fabric can follow the shape."
            ],
            [
              "Compaction and support",
              "Use the PMI core and a consistent shell geometry during forming."
            ],
            [
              "Assembly precision",
              "Reserve critical features for CNC finishing after molding."
            ],
            [
              "Layup access and demolding",
              "Keep openings and wall features workable for the manufacturing process."
            ]
          ]
        }
      },
      {
        "id": "cad-to-workshop",
        "label": "CAD to workshop",
        "title": "Structural comparison and physical iteration",
        "paragraphs": [
          "I used SolidWorks for the geometry and Simulation for geometry-led comparisons with directional material properties. This workflow let me compare stress patterns and torsional behavior while keeping design changes close to the CAD used for manufacturing.",
          "The development ran through an initial design cycle, the first manufactured parts, hands-on checks and further workshop feedback. Fit, interlaminar bonding and local interfaces became central iteration points as the CAD turned into a usable part.",
          "A manufactured version suitable for the robot was reached in May 2025. The photographs below connect the hollow CAD model, composite blank, simulation views and assembled leg."
        ]
      }
    ]
